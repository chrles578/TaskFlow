<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskflow — Beautiful Todo & Notes</title>
  <meta name="description" content="A stunning, modern todo list and notes application with customizable themes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <!-- Theme Picker Floating Button -->
  <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Change theme">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5" />
      <path
        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
    </svg>
  </button>

  <!-- Theme Picker Panel -->
  <div id="theme-panel" class="theme-panel hidden">
    <div class="theme-panel-header">
      <h3>Choose Theme</h3>
      <button id="theme-panel-close" class="theme-panel-close" aria-label="Close theme panel">&times;</button>
    </div>
    <div class="theme-grid" id="theme-grid">
      <!-- Themes injected by JS -->
    </div>
  </div>

  <!-- Main App -->
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
          </svg>
        </div>
        <h1>Taskflow</h1>
      </div>
      <p class="header-subtitle">Organize your day, beautifully.</p>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card" id="stat-total">
        <span class="stat-num">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card" id="stat-active">
        <span class="stat-num">0</span>
        <span class="stat-label">Active</span>
      </div>
      <div class="stat-card" id="stat-done">
        <span class="stat-num">0</span>
        <span class="stat-label">Done</span>
      </div>
      <div class="stat-card" id="stat-notes">
        <span class="stat-num">0</span>
        <span class="stat-label">Notes</span>
      </div>
    </div>

    <!-- Tab Navigation -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="tasks" id="tab-tasks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
        </svg>
        Tasks
      </button>
      <button class="tab-btn" data-tab="notes" id="tab-notes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
        Notes
      </button>
    </nav>

    <!-- Tasks Section -->
    <section id="tasks-section" class="content-section active">
      <form id="task-form" class="input-form" autocomplete="off">
        <div class="input-row">
          <input type="text" id="task-input" class="text-input" placeholder="What needs to be done?" required />
          <select id="task-priority" class="priority-select">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button type="submit" class="add-btn" id="add-task-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>
      </form>

      <!-- Filter Buttons -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
        <button class="filter-btn" data-filter="active" id="filter-active">Active</button>
        <button class="filter-btn" data-filter="completed" id="filter-completed">Completed</button>
      </div>

      <ul id="task-list" class="item-list">
        <!-- Tasks rendered by JS -->
      </ul>

      <div id="tasks-empty" class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
        </svg>
        <p>No tasks yet — add one above!</p>
      </div>
    </section>

    <!-- Notes Section -->
    <section id="notes-section" class="content-section">
      <form id="note-form" class="input-form" autocomplete="off">
        <div class="input-col">
          <input type="text" id="note-title-input" class="text-input" placeholder="Note title" required />
          <textarea id="note-body-input" class="text-area" placeholder="Write your note here..." rows="3"
            required></textarea>
          <div class="note-form-footer">
            <div class="note-color-picker">
              <span class="color-label">Color:</span>
              <button type="button" class="note-color-dot active" data-color="default"
                style="background: var(--note-default)" aria-label="Default color"></button>
              <button type="button" class="note-color-dot" data-color="rose" style="background: var(--note-rose)"
                aria-label="Rose color"></button>
              <button type="button" class="note-color-dot" data-color="amber" style="background: var(--note-amber)"
                aria-label="Amber color"></button>
              <button type="button" class="note-color-dot" data-color="emerald" style="background: var(--note-emerald)"
                aria-label="Emerald color"></button>
              <button type="button" class="note-color-dot" data-color="sky" style="background: var(--note-sky)"
                aria-label="Sky color"></button>
              <button type="button" class="note-color-dot" data-color="violet" style="background: var(--note-violet)"
                aria-label="Violet color"></button>
            </div>
            <button type="submit" class="add-btn" id="add-note-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
          </div>
        </div>
      </form>

      <div id="notes-grid" class="notes-grid">
        <!-- Notes rendered by JS -->
      </div>

      <div id="notes-empty" class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
        <p>No notes yet — create one above!</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>

</html>
